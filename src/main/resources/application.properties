spring.application.name=resource-booking-system

# ---------------------------------------------------------------------------
# Datasource
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:resource_booking_db}?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# JWT
# ---------------------------------------------------------------------------
security.jwt.secret=${JWT_SECRET:change-this-super-secret-key-min-256-bits-long-please-1234567890}
security.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# ---------------------------------------------------------------------------
# Swagger / OpenAPI
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# Jackson
# ---------------------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
